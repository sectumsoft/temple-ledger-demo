<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17202f;--muted:#778195;--line:#e7eaf0;--nav:#17231f;--nav2:#24342d;--green:#1c7c54;--green2:#e7f5ed;--gold:#c49a48;--red:#b84646;--redbg:#fff0ef;--amber:#986c16;--amberbg:#fff6df;--blue:#3c66bd;--bluebg:#edf3ff;--shadow:0 8px 28px rgba(20,31,26,.05)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:252px;background:var(--nav);color:#e8eee9;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 27px}.brandmark{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#e1c37d,#a47b32);display:grid;place-items:center;color:#17231f;font-size:20px;font-weight:800}.brand h1{font-size:15px;margin:0;letter-spacing:.2px}.brand p{margin:4px 0 0;color:#a7b5ad;font-size:11px}.navlabel{color:#7f9187;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;padding:12px 12px 8px}.navbtn{border:0;background:transparent;color:#b8c5bd;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:9px;text-align:left;margin:2px 0;font-size:13px}.navbtn .ico{width:20px;text-align:center;font-size:16px}.navbtn:hover{background:#203129;color:#fff}.navbtn.active{background:#2a4437;color:#fff;box-shadow:inset 3px 0 #d5b366}.sidebottom{margin-top:auto;border-top:1px solid #34443b;padding:16px 8px 0;color:#a8b6ad;font-size:11px;line-height:1.7}.online{display:inline-block;width:7px;height:7px;background:#6fd69b;border-radius:50%;margin-right:6px}.main{min-width:0;flex:1}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;gap:20px}.crumb{color:var(--muted);font-size:12px}.crumb strong{color:var(--text);font-weight:600}.topright{display:flex;align-items:center;gap:14px}.demo-tag{background:#fff6df;color:#805b12;border:1px solid #f0dfb4;border-radius:20px;padding:6px 10px;font-size:11px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;background:#e7efe9;color:#315542;display:grid;place-items:center;font-weight:800}.profile{font-size:12px}.profile small{display:block;color:var(--muted);margin-top:3px}.content{max-width:1450px;margin:auto;padding:30px 32px 44px}.pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--green);font-weight:800;margin-bottom:8px}.pagehead h2{font-size:27px;letter-spacing:-.8px;margin:0 0 8px}.pagehead p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:9px;font-weight:650;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.dark{background:#1e2d25;color:#fff;border-color:#1e2d25}.btn.gold{background:#c49a48;color:#1d281f;border-color:#c49a48}.btn.danger{background:#fff;color:var(--red);border-color:#efcaca}.btn.small{padding:7px 10px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:var(--shadow)}.stathead{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:33px;height:33px;border-radius:10px;background:#eef5f0;color:var(--green);display:grid;place-items:center;font-size:16px}.statvalue{font-size:27px;font-weight:750;letter-spacing:-.7px;margin:13px 0 6px}.statfoot{font-size:11px;color:var(--muted)}.statfoot b{color:var(--green)}.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:18px;margin-bottom:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);overflow:hidden}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.panelhead h3{margin:0;font-size:14px}.panelhead p{margin:5px 0 0;color:var(--muted);font-size:11px}.panelbody{padding:18px 20px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th{text-align:left;background:#fafbfc;color:#8992a2;text-transform:uppercase;letter-spacing:.65px;font-size:10px;font-weight:750;padding:12px 16px;border-bottom:1px solid var(--line)}td{padding:14px 16px;border-bottom:1px solid #eef0f4;font-size:12px}tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:10px}.persondot{width:31px;height:31px;border-radius:9px;background:#e9f2ec;color:#35654b;display:grid;place-items:center;font-weight:800;font-size:11px}.person b{display:block;font-size:12px}.person small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 8px;font-size:10px;font-weight:750}.pill.green{background:var(--green2);color:#24764f}.pill.amber{background:var(--amberbg);color:var(--amber)}.pill.red{background:var(--redbg);color:var(--red)}.pill.blue{background:var(--bluebg);color:var(--blue)}.pill.gray{background:#f0f2f5;color:#667085}.activity{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eef0f4}.activity:last-child{border-bottom:0}.activityicon{width:31px;height:31px;flex-shrink:0;border-radius:9px;background:#eff5f0;display:grid;place-items:center}.activity b{font-size:12px}.activity p{margin:4px 0;color:var(--muted);font-size:11px;line-height:1.5}.activity time{font-size:10px;color:#9ba3b1}.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{padding:15px;border:1px solid var(--line);border-radius:11px;text-align:left;background:#fff}.quick:hover{border-color:#aac9b5;background:#fbfefc}.quick .qico{width:34px;height:34px;border-radius:9px;background:#eaf3ed;color:var(--green);display:grid;place-items:center;font-size:18px;margin-bottom:12px}.quick b{display:block;font-size:12px}.quick span{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.4}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#596477}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe4eb;border-radius:8px;padding:11px 12px;background:#fff;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6ca787;box-shadow:0 0 0 3px #e6f4eb}.field small{color:var(--muted);font-size:10px;line-height:1.5}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.sectiontitle{font-size:13px;font-weight:800;margin:0 0 15px}.notice{display:flex;gap:10px;background:#f0f7f2;border:1px solid #d8ebdd;color:#315d42;border-radius:9px;padding:12px 14px;font-size:11px;line-height:1.6;margin-bottom:18px}.notice.warn{background:#fff8e8;border-color:#f0dfb3;color:#805e19}.notice.error{background:#fff1ef;border-color:#f2d0ca;color:#9b3838}.progress{height:6px;background:#edf0f3;border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:10px}.empty{text-align:center;padding:42px 20px;color:var(--muted)}.empty .big{font-size:30px;margin-bottom:10px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.search{min-width:220px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;outline:none}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:8px;color:#5f6979;font-size:11px}.modalback{position:fixed;inset:0;background:rgba(12,20,16,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modalback.show{display:flex}.modal{background:#fff;border-radius:16px;width:min(520px,100%);box-shadow:0 25px 80px rgba(0,0,0,.2);overflow:hidden}.modalhead{padding:19px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modalhead h3{margin:0;font-size:16px}.xbtn{border:0;background:#f2f3f5;border-radius:8px;width:30px;height:30px;font-size:18px}.modalbody{padding:22px}.otpboxes{display:flex;gap:8px;margin:14px 0}.otpboxes input{width:45px;height:49px;border:1px solid #d7dfe6;border-radius:9px;text-align:center;font-size:21px;font-weight:800}.modalfoot{padding:15px 22px;background:#fafbfc;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;bottom:22px;right:22px;max-width:360px;background:#17231f;color:#fff;padding:14px 17px;border-radius:10px;box-shadow:0 12px 35px #1113;z-index:20;display:none;font-size:12px}.toast.show{display:block;animation:pop .2s ease}@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}.steps{display:flex;gap:7px;margin:0 0 20px}.step{height:5px;flex:1;border-radius:6px;background:#e9edf0}.step.done{background:var(--green)}.receiptchip{display:inline-block;background:#f5f7f8;border:1px solid #e4e8ec;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700}.money{font-variant-numeric:tabular-nums;font-weight:800}.muted{color:var(--muted)}.right{text-align:right}.mt{margin-top:16px}.hide{display:none!important}
@media(max-width:1100px){.sidebar{width:215px}.content{padding:24px 20px}.topbar{padding:0 20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.quickgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{width:100%;padding:12px;display:block}.brand{padding:4px 6px 12px}.navlabel,.sidebottom{display:none}.navgroup{display:flex;overflow:auto;gap:4px}.navbtn{width:auto;white-space:nowrap;padding:9px 10px}.navbtn .ico{width:auto}.topbar{height:58px;padding:0 14px}.profile{display:none}.content{padding:22px 13px}.pagehead{display:block}.pagehead .btn{margin-top:16px}.pagehead h2{font-size:23px}.cards{gap:9px}.stat{padding:14px}.statvalue{font-size:22px}.stathead{font-size:10px}.grid2{gap:12px}.quickgrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.panelhead,.panelbody{padding:15px}.demo-tag{display:none}.search{min-width:100%}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brandmark">✦</div><div><h1>Temple Ledger</h1><p>Receipt accountability</p></div></div>
  <div class="navlabel">Workspace</div>
  <div class="navgroup">
    <button class="navbtn active" data-page="dashboard" data-role="admin"><span class="ico">▦</span> Dashboard</button>
    <button class="navbtn" data-page="volDashboard" data-role="volunteer" style="display:none"><span class="ico">▦</span> My Dashboard</button>
    <button class="navbtn" data-page="myCollection" data-role="volunteer" style="display:none"><span class="ico">＋</span> Add Collection</button>
    <button class="navbtn" data-page="myHistory" data-role="volunteer" style="display:none"><span class="ico">◷</span> My History</button>
    <button class="navbtn" data-page="issue" data-role="admin"><span class="ico">＋</span> Issue a book</button>
    <button class="navbtn" data-page="return" data-role="admin"><span class="ico">↩</span> Return a book</button>
    <button class="navbtn" data-page="books" data-role="admin"><span class="ico">▤</span> Receipt books</button>
    <button class="navbtn" data-page="volunteers" data-role="admin"><span class="ico">♙</span> Volunteers</button>
    <button class="navbtn" data-page="reports" data-role="admin"><span class="ico">▥</span> Reports & history</button>
  </div>
  <div class="sidebottom"><span class="online"></span> Demo workspace active<br/>Sample data · Local browser session<br/><br/>Temple Ledger © 2026</div>
</aside>
<main class="main">
  <header class="topbar"><div class="crumb">Temple Office <span style="margin:0 8px;color:#c3c9d2">/</span> <strong id="crumb">Dashboard</strong></div><div class="topright"><span class="demo-tag">DEMO MODE · SAMPLE DATA</span><button class="btn small" id="roleSwitch" onclick="toggleRole()">Switch to Volunteer View ↗</button><div class="avatar" id="avatar">T</div><div class="profile"><b id="profileName">Treasurer</b><small id="profileRole">Temple Administrator</small></div></div></header>
  <div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Verify OTP</h3><button class="xbtn" id="closeModal">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot" id="modalFoot"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const today = new Date();
const iso = d => {let x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const plusDays = n => {let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtDate = s => s ? new Date(s+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const money = n => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
let books=[
{id:'B001',start:1,end:25,status:'Issued',holder:'Vignesh K',phone:'9876543210',issueDate:plusDays(-19),dueDate:plusDays(11),used:10,collection:12500,cash:12500,assignments:[{person:'Vignesh K',phone:'9876543210',issueDate:plusDays(-19),dueDate:plusDays(11),status:'Active'}]},
{id:'B002',start:26,end:50,status:'Issued',holder:'Meera S',phone:'9876501234',issueDate:plusDays(-35),dueDate:plusDays(-5),used:18,collection:18600,cash:18000,assignments:[{person:'Meera S',phone:'9876501234',issueDate:plusDays(-35),dueDate:plusDays(-5),status:'Active'}]},
{id:'B003',start:51,end:75,status:'Available',holder:'',phone:'',issueDate:'',dueDate:'',used:0,collection:0,cash:0,assignments:[]},
{id:'B004',start:76,end:100,status:'Issued',holder:'Arun P',phone:'9895001122',issueDate:plusDays(-8),dueDate:plusDays(22),used:5,collection:4200,cash:4200,assignments:[{person:'Arun P',phone:'9895001122',issueDate:plusDays(-8),dueDate:plusDays(22),status:'Active'}]},
{id:'B005',start:101,end:125,status:'Available',holder:'',phone:'',issueDate:'',dueDate:'',used:0,collection:0,cash:0,assignments:[]},
{id:'B006',start:126,end:150,status:'Closed',holder:'',phone:'',issueDate:plusDays(-70),dueDate:plusDays(-40),used:25,collection:27500,cash:27500,assignments:[{person:'Lakshmi R',phone:'9847002221',issueDate:plusDays(-70),dueDate:plusDays(-40),status:'Closed'}]}
];
let volunteers=[
{id:'V001',name:'Vignesh K',phone:'9876543210',status:'Active',books:1},
{id:'V002',name:'Meera S',phone:'9876501234',status:'Active',books:1},
{id:'V003',name:'Arun P',phone:'9895001122',status:'Active',books:1},
{id:'V004',name:'Lakshmi R',phone:'9847002221',status:'Active',books:0},
{id:'V005',name:'Suresh M',phone:'9895112233',status:'Active',books:0}
];
let events=[
{icon:'↗',title:'Book B004 issued to Arun P',desc:'Receipts 0076–0100 · OTP verified',date:plusDays(-8)},
{icon:'✓',title:'Book B006 closed',desc:'Lakshmi R · Cash settled ₹27,500',date:plusDays(-40)},
{icon:'↗',title:'Book B001 issued to Vignesh K',desc:'Receipts 0001–0025 · OTP verified',date:plusDays(-19)},
{icon:'!',title:'Book B002 is overdue',desc:'Meera S · Return due date passed',date:plusDays(-5)}
];
let currentPage='dashboard', modalAction=null, pendingOtp='123456', toastTimer, currentRole='admin';
let collectionEntries=[
{id:1,bookId:'B001',volunteer:'Vignesh K',date:plusDays(-2),from:1,to:3,amount:3000,note:'Morning collection',status:'Pending verification'},
{id:2,bookId:'B001',volunteer:'Vignesh K',date:plusDays(-1),from:4,to:6,amount:4500,note:'Evening collection',status:'Pending verification'},
{id:3,bookId:'B001',volunteer:'Vignesh K',date:plusDays(0),from:7,to:10,amount:5000,note:'Daily collection',status:'Pending verification'}
];
const content=document.getElementById('content');
const pill=(text,cls)=>`<span class="pill ${cls}">${text}</span>`;
const initials=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase();
const statusPill=s=>s==='Issued'?pill('● Issued','green'):s==='Available'?pill('● Available','blue'):s==='Closed'?pill('● Closed','gray'):s==='Overdue'?pill('● Overdue','red'):pill(s,'amber');
const bookOptions=(includeIssued=false)=>books.filter(b=>includeIssued?b.status!=='Closed':b.status==='Available').map(b=>`<option value="${b.id}">${b.id} · Receipts ${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')} (${b.status})</option>`).join('');
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500)}
function nav(page){currentPage=page;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('crumb').textContent=({dashboard:'Dashboard',issue:'Issue a book',return:'Return a book',books:'Receipt books',volunteers:'Volunteers',reports:'Reports & history',volDashboard:'My Dashboard',myCollection:'Add Collection',myHistory:'My History'})[page]||'Dashboard';render()}
function toggleRole(){currentRole=currentRole==='admin'?'volunteer':'admin';document.querySelectorAll('.navbtn').forEach(b=>{b.style.display=b.dataset.role===currentRole?'flex':'none';b.classList.remove('active')});document.getElementById('profileName').textContent=currentRole==='admin'?'Treasurer':'Vignesh K';document.getElementById('profileRole').textContent=currentRole==='admin'?'Temple Administrator':'Volunteer · V001';document.getElementById('avatar').textContent=currentRole==='admin'?'T':'V';document.getElementById('roleSwitch').textContent=currentRole==='admin'?'Switch to Volunteer View ↗':'Switch to Treasurer View ↗';nav(currentRole==='admin'?'dashboard':'volDashboard')}
document.querySelectorAll('.navbtn').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function head(eyebrow,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function render(){if(currentPage==='dashboard')renderDashboard();if(currentPage==='volDashboard')renderVolunteerDashboard();if(currentPage==='myCollection')renderMyCollection();if(currentPage==='myHistory')renderMyHistory();if(currentPage==='issue')renderIssue();if(currentPage==='return')renderReturn();if(currentPage==='books')renderBooks();if(currentPage==='volunteers')renderVolunteers();if(currentPage==='reports')renderReports()}
function renderDashboard(){
let issued=books.filter(b=>b.status==='Issued'),overdue=issued.filter(b=>b.dueDate<iso(new Date())),total=issued.reduce((a,b)=>a+b.collection,0);
content.innerHTML=head('TEMPLE OFFICE / OVERVIEW','Good evening, Treasurer','Here is the current status of receipt books and collection accountability.',`<button class="btn primary" onclick="nav('issue')">＋ Issue a book</button>`)+
`<div class="cards">
<div class="stat"><div class="stathead">Books currently issued <span class="staticon">▤</span></div><div class="statvalue">${issued.length}</div><div class="statfoot"><b>${books.filter(b=>b.status==='Available').length} available</b> to issue</div></div>
<div class="stat"><div class="stathead">Overdue books <span class="staticon" style="background:#fff1ef;color:#b84646">◷</span></div><div class="statvalue">${overdue.length}</div><div class="statfoot">${overdue.length?'Follow-up required':'All returns on schedule'}</div></div>
<div class="stat"><div class="stathead">Recorded collection <span class="staticon">₹</span></div><div class="statvalue">${money(total)}</div><div class="statfoot">Across currently issued books</div></div>
<div class="stat"><div class="stathead">Cash difference <span class="staticon" style="background:#fff6df;color:#986c16">≠</span></div><div class="statvalue">${money(issued.reduce((a,b)=>a+b.collection-b.cash,0))}</div><div class="statfoot">Collection minus cash received</div></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Books requiring attention</h3><p>Active assignments and return due dates</p></div><button class="btn small" onclick="nav('books')">View all →</button></div><div class="tablewrap"><table><thead><tr><th>Book / receipts</th><th>Current holder</th><th>Due date</th><th>Status</th></tr></thead><tbody>${issued.map(b=>`<tr><td><b>${b.id}</b><div class="muted" style="font-size:10px;margin-top:4px">${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}</div></td><td><div class="person"><div class="persondot">${initials(b.holder)}</div><div><b>${b.holder}</b><small>${b.phone}</small></div></div></td><td>${fmtDate(b.dueDate)}</td><td>${b.dueDate<iso(new Date())?pill('Overdue','red'):pill('Issued','green')}</td></tr>`).join('')}</tbody></table></div></section>
<section class="panel"><div class="panelhead"><div><h3>Recent activity</h3><p>Latest book actions</p></div><button class="btn small" onclick="nav('reports')">Full history →</button></div><div class="panelbody">${events.slice(0,4).map(e=>`<div class="activity"><div class="activityicon">${e.icon}</div><div><b>${e.title}</b><p>${e.desc}</p><time>${fmtDate(e.date)}</time></div></div>`).join('')}</div></section></div>
<section class="panel"><div class="panelhead"><div><h3>Quick actions</h3><p>Common tasks for the treasurer</p></div></div><div class="panelbody"><div class="quickgrid">
<button class="quick" onclick="nav('issue')"><div class="qico">＋</div><b>Issue a receipt book</b><span>Assign a book and verify volunteer OTP</span></button>
<button class="quick" onclick="nav('return')"><div class="qico">↩</div><b>Return a receipt book</b><span>Reconcile receipts, cash and closure</span></button>

function getVolunteerBook(){return books.find(b=>b.status==='Issued'&&b.holder==='Vignesh K')}
function renderVolunteerDashboard(){
const b=getVolunteerBook(), entries=collectionEntries.filter(e=>e.volunteer==='Vignesh K'), total=entries.reduce((s,e)=>s+e.amount,0), pending=entries.filter(e=>e.status!=='Verified').reduce((s,e)=>s+e.amount,0);
content.innerHTML=head('VOLUNTEER PORTAL','Welcome back, Vignesh','Track your assigned receipt book and record collections as they happen.',`<button class="btn primary" onclick="nav('myCollection')">＋ Add collection</button>`)+
`<div class="notice"><span>ℹ</span><div>This is the volunteer view. Collection entries are recorded against your assigned book. The Treasurer verifies cash handover and closes the book.</div></div>
<div class="cards"><div class="stat"><div class="stathead">Assigned book <span class="staticon">▤</span></div><div class="statvalue">${b?b.id:'None'}</div><div class="statfoot">${b?'Receipts '+String(b.start).padStart(4,'0')+'–'+String(b.end).padStart(4,'0'):'No active assignment'}</div></div><div class="stat"><div class="stathead">Receipts recorded <span class="staticon">✓</span></div><div class="statvalue">${entries.reduce((s,e)=>s+(e.to-e.from+1),0)}</div><div class="statfoot">Of ${b?b.end-b.start+1:0} assigned receipts</div></div><div class="stat"><div class="stathead">Total collection entered <span class="staticon">₹</span></div><div class="statvalue">${money(total)}</div><div class="statfoot">From your saved entries</div></div><div class="stat"><div class="stathead">Awaiting verification <span class="staticon">◷</span></div><div class="statvalue">${money(pending)}</div><div class="statfoot">Cash handover to be confirmed by Treasurer</div></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>My assigned receipt book</h3><p>Current responsibility</p></div>${b?statusPill(b.status):pill('Unassigned','gray')}</div><div class="panelbody">${b?`<div style="font-size:24px;font-weight:800;margin-bottom:5px">${b.id}</div><p class="muted">Receipt range ${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}</p><div style="display:flex;justify-content:space-between;font-size:12px;margin:20px 0 8px"><b>Receipt usage</b><span>${Math.min(b.used,b.end-b.start+1)} / ${b.end-b.start+1}</span></div><div class="progress"><span style="width:${Math.min(100,b.used/(b.end-b.start+1)*100)}%"></span></div><div style="display:flex;justify-content:space-between;margin-top:18px;font-size:12px"><span class="muted">Due date</span><b>${fmtDate(b.dueDate)}</b></div>`:'No book is currently assigned to your account.'}</div></section>
<section class="panel"><div class="panelhead"><div><h3>Recent collection entries</h3><p>Latest activity in your account</p></div><button class="btn small" onclick="nav('myHistory')">View history →</button></div><div class="panelbody">${entries.slice(-3).reverse().map(e=>`<div class="activity"><div class="activityicon">₹</div><div><b>${money(e.amount)} · Receipts ${String(e.from).padStart(4,'0')}–${String(e.to).padStart(4,'0')}</b><p>${e.note||'Collection entry'} · ${pill(e.status,e.status==='Verified'?'green':'amber')}</p><time>${fmtDate(e.date)}</time></div></div>`).join('')||'<div class="empty">No collection entries yet.</div>'}</div></section></div>`;
}
function renderMyCollection(){
 const b=getVolunteerBook();
 const form=b ? `<section class="panel"><div class="panelhead"><div><h3>New collection entry</h3><p>Book ${b.id} · Receipts ${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}</p></div>${pill('Assigned to you','green')}</div><div class="panelbody"><div class="formgrid"><div class="field"><label>Collection date</label><input id="collectionDate" type="date" value="${iso(new Date())}" max="${iso(new Date())}"></div><div class="field"><label>Amount collected (₹)</label><input id="collectionAmount" type="number" min="1" step="1" placeholder="e.g. 2500"></div><div class="field"><label>First receipt number</label><input id="collectionFrom" type="number" min="${b.start}" max="${b.end}" placeholder="${b.start}"></div><div class="field"><label>Last receipt number</label><input id="collectionTo" type="number" min="${b.start}" max="${b.end}" placeholder="${b.end}"></div><div class="field full"><label>Notes (optional)</label><textarea id="collectionNote" rows="3" placeholder="e.g. Morning collection / donor event"></textarea></div></div><div class="notice warn mt"><span>!</span><div>Only enter receipt numbers actually used. This demo stores entries in this browser session; production should validate duplicates on the server.</div></div><div class="formactions"><button class="btn" onclick="nav('volDashboard')">Cancel</button><button class="btn primary" onclick="saveCollectionEntry()">Save collection entry</button></div></div></section>` : '<div class="notice warn">No active receipt book is assigned to this volunteer.</div>';
 content.innerHTML=head('VOLUNTEER PORTAL','Add collection','Record a collection against your active receipt book. Saved entries appear in your history and the Treasurer’s reports.')+form;
}
function saveCollectionEntry(){const b=getVolunteerBook();if(!b){toast('No active receipt book assigned.');return}const date=document.getElementById('collectionDate').value,amount=Number(document.getElementById('collectionAmount').value),from=Number(document.getElementById('collectionFrom').value),to=Number(document.getElementById('collectionTo').value),note=document.getElementById('collectionNote').value.trim();if(!date||!Number.isFinite(amount)||amount<=0||!Number.isInteger(from)||!Number.isInteger(to)||from<b.start||to> b.end||to<from){toast('Check the date, amount and receipt range.');return}if(collectionEntries.some(e=>e.bookId===b.id&&!(to<e.from||from>e.to))){toast('One or more receipt numbers already exist in a saved entry.');return}collectionEntries.push({id:Date.now(),bookId:b.id,volunteer:'Vignesh K',date,from,to,amount,note,status:'Pending verification'});b.used=Math.max(b.used,to-b.start+1);b.collection+=amount;events.unshift({icon:'₹',title:`${money(amount)} collection entered by Vignesh K`,desc:`${b.id} · Receipts ${String(from).padStart(4,'0')}–${String(to).padStart(4,'0')}`,date});toast('Collection entry saved for Treasurer review.');nav('volDashboard')}
function renderMyHistory(){const entries=collectionEntries.filter(e=>e.volunteer==='Vignesh K').slice().sort((a,b)=>b.date.localeCompare(a.date));content.innerHTML=head('VOLUNTEER PORTAL','My collection history','A read-only timeline of your submitted collection entries.',`<button class="btn" onclick="nav('myCollection')">＋ Add collection</button>`)+`<section class="panel"><div class="panelhead"><div><h3>Collection entries</h3><p>${entries.length} saved entries</p></div></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Book</th><th>Receipt range</th><th>Amount</th><th>Notes</th><th>Verification</th></tr></thead><tbody>${entries.map(e=>`<tr><td>${fmtDate(e.date)}</td><td><b>${e.bookId}</b></td><td>${String(e.from).padStart(4,'0')}–${String(e.to).padStart(4,'0')}</td><td class="money">${money(e.amount)}</td><td>${e.note||'—'}</td><td>${pill(e.status,e.status==='Verified'?'green':'amber')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No entries found.</td></tr>'}</tbody></table></div></section>`}

function renderIssue(){
content.innerHTML=head('BOOK CUSTODY','Issue a receipt book','Assign a registered receipt book to a volunteer. OTP verification is required before the issue is confirmed.')+
`<div class="notice"><span>ⓘ</span><div><b>Demo OTP:</b> This prototype simulates SMS delivery. Use <b>123456</b> to complete the demo flow. No real SMS will be sent.</div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>New book assignment</h3><p>All fields marked with * are required</p></div><span class="pill blue">Step 1 of 2</span></div><div class="panelbody"><form id="issueForm"><div class="formgrid">
<div class="field full"><label>Receipt book *</label><select id="issueBook" required><option value="">Select an available book</option>${bookOptions()}</select><small>Only available books can be issued.</small></div>
<div class="field"><label>Volunteer *</label><select id="issueVolunteer" required><option value="">Select volunteer</option>${volunteers.filter(v=>v.status==='Active').map(v=>`<option value="${v.id}">${v.name}</option>`).join('')}</select></div>
<div class="field"><label>Registered mobile number</label><input id="issuePhone" readonly placeholder="Auto-filled from volunteer"/></div>
<div class="field"><label>Issue date *</label><input id="issueDate" type="date" value="${iso(new Date())}" required/></div>
<div class="field"><label>Return due date *</label><input id="issueDue" type="date" value="${plusDays(30)}" required/></div>
<div class="field full"><label>Notes (optional)</label><textarea id="issueNotes" rows="2" placeholder="Purpose or additional notes"></textarea></div>
</div><div class="formactions"><button type="button" class="btn" onclick="nav('books')">Cancel</button><button type="submit" class="btn primary">Send OTP →</button></div></form></div></section>
<section class="panel"><div class="panelhead"><div><h3>Before you issue</h3><p>Custody and verification rules</p></div></div><div class="panelbody">
<div class="activity"><div class="activityicon">01</div><div><b>Check the receipt range</b><p>Confirm the physical book number and serial numbers match the selected record.</p></div></div>
<div class="activity"><div class="activityicon">02</div><div><b>Verify the volunteer</b><p>The OTP is sent to the volunteer's registered mobile number. The volunteer tells the code to the treasurer.</p></div></div>
<div class="activity"><div class="activityicon">03</div><div><b>Confirm only after verification</b><p>The assignment is saved only after a valid OTP is entered.</p></div></div>
<div class="notice warn mt"><span>!</span><div>One book can have only one active assignment at a time. Previous assignment history is never deleted.</div></div>
</div></section></div>`;
document.getElementById('issueVolunteer').addEventListener('change',e=>{let v=volunteers.find(x=>x.id===e.target.value);document.getElementById('issuePhone').value=v?v.phone:''});
document.getElementById('issueForm').addEventListener('submit',e=>{e.preventDefault();let book=books.find(b=>b.id===document.getElementById('issueBook').value),vol=volunteers.find(v=>v.id===document.getElementById('issueVolunteer').value);if(!book||!vol)return;if(document.getElementById('issueDue').value<document.getElementById('issueDate').value){toast('Due date cannot be earlier than issue date.');return}openOtp('Issue book '+book.id,`An OTP would be sent to ${vol.name} (${vol.phone.slice(0,3)}•••••••).`,()=>{book.status='Issued';book.holder=vol.name;book.phone=vol.phone;book.issueDate=document.getElementById('issueDate').value;book.dueDate=document.getElementById('issueDue').value;book.used=0;book.collection=0;book.cash=0;book.assignments.push({person:vol.name,phone:vol.phone,issueDate:book.issueDate,dueDate:book.dueDate,status:'Active'});vol.books++;events.unshift({icon:'↗',title:`Book ${book.id} issued to ${vol.name}`,desc:`Receipts ${String(book.start).padStart(4,'0')}–${String(book.end).padStart(4,'0')} · OTP verified`,date:book.issueDate});toast(`${book.id} successfully issued to ${vol.name}.`);nav('books')})});
}
function renderReturn(){
let active=books.filter(b=>b.status==='Issued');
content.innerHTML=head('BOOK CUSTODY','Return a receipt book','Record receipt usage and cash reconciliation, verify return OTP, then confirm physical receipt.')+
`<div class="notice"><span>ⓘ</span><div><b>Demo OTP:</b> Use <b>123456</b> for simulated OTP verification. A book is not closed until physical receipt is confirmed.</div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Book return & reconciliation</h3><p>Record the return before closing the assignment</p></div></div><div class="panelbody"><form id="returnForm"><div class="formgrid">
<div class="field full"><label>Active receipt book *</label><select id="returnBook" required><option value="">Select an issued book</option>${active.map(b=>`<option value="${b.id}">${b.id} · ${b.holder} · Receipts ${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}</option>`).join('')}</select></div>
<div class="field"><label>Responsible volunteer</label><input id="returnHolder" readonly/></div>
<div class="field"><label>Return date *</label><input id="returnDate" type="date" value="${iso(new Date())}" required/></div>
<div class="field"><label>Used receipts count *</label><input id="usedCount" type="number" min="0" max="25" value="10" required/></div>
<div class="field"><label>Unused receipts count</label><input id="unusedCount" type="number" readonly value="15"/></div>
<div class="field"><label>Total collection (₹) *</label><input id="returnCollection" type="number" min="0" value="12500" required/></div>
<div class="field"><label>Cash received (₹) *</label><input id="returnCash" type="number" min="0" value="12500" required/></div>
<div class="field full"><label>Used receipt numbers / range</label><input id="usedRange" value="0001–0010" placeholder="e.g. 0001–0010"/><small>Confirm the physical receipt leaves. Record missing or cancelled receipts in the notes.</small></div>
<div class="field full"><label>Return notes</label><textarea id="returnNotes" rows="2" placeholder="Discrepancies, missing leaves, or other notes"></textarea></div>
</div><div id="returnDiff" class="notice mt"><span>✓</span><div>Collection and cash received match.</div></div><div class="formactions"><button type="button" class="btn" onclick="nav('books')">Cancel</button><button type="submit" class="btn primary">Verify return OTP →</button></div></form></div></section>
<section class="panel"><div class="panelhead"><div><h3>Closure checklist</h3><p>Book closure requires all steps</p></div></div><div class="panelbody">
<div class="activity"><div class="activityicon">1</div><div><b>Receipt count reviewed</b><p>Used and unused leaves total 25. Investigate any missing or duplicate serial numbers.</p></div></div>
<div class="activity"><div class="activityicon">2</div><div><b>Collection reconciled</b><p>Compare the declared total with cash physically received. Record any difference.</p></div></div>
<div class="activity"><div class="activityicon">3</div><div><b>Return OTP verified</b><p>OTP goes to the same registered number used for this assignment.</p></div></div>
<div class="activity"><div class="activityicon">4</div><div><b>Physical receipt confirmed</b><p>Treasurer checks the book and explicitly confirms receipt before closure.</p></div></div>
<div class="notice warn mt"><span>!</span><div>OTP verification alone does not close the book. Physical verification is a separate required step.</div></div>
</div></section></div>`;
const sel=document.getElementById('returnBook'),used=document.getElementById('usedCount'),unused=document.getElementById('unusedCount'),coll=document.getElementById('returnCollection'),cash=document.getElementById('returnCash');
function fillReturn(){let b=books.find(x=>x.id===sel.value);document.getElementById('returnHolder').value=b?b.holder:'';if(b){used.value=b.used||0;unused.value=25-(b.used||0);coll.value=b.collection||0;cash.value=b.cash||0;document.getElementById('usedRange').value=b.used?`${String(b.start).padStart(4,'0')}–${String(b.start+b.used-1).padStart(4,'0')}`:''}updateReturnDiff()}
function updateReturnDiff(){let u=Number(used.value||0);unused.value=25-u;let d=Number(coll.value||0)-Number(cash.value||0),el=document.getElementById('returnDiff');el.className='notice mt'+(d?' warn':'');el.innerHTML=`<span>${d?'!':'✓'}</span><div>${d?`Difference detected: <b>${money(d)}</b> (${d>0?'cash shortfall':'cash exceeds collection'}). Review before closure.`:'Collection and cash received match.'}</div>`}
sel.addEventListener('change',fillReturn);[used,coll,cash].forEach(x=>x.addEventListener('input',updateReturnDiff));
document.getElementById('returnForm').addEventListener('submit',e=>{e.preventDefault();let b=books.find(x=>x.id===sel.value);if(!b)return;let u=Number(used.value),c=Number(coll.value),ca=Number(cash.value);if(u<0||u>25){toast('Used receipt count must be between 0 and 25.');return}if(!document.getElementById('usedRange').value.trim()&&u>0){toast('Enter the used receipt number range.');return}openOtp('Return book '+b.id,`Return OTP would be sent to ${b.holder} (${b.phone.slice(0,3)}•••••••).`,()=>{b.pendingReturn={date:document.getElementById('returnDate').value,used:u,unused:25-u,collection:c,cash:ca,range:document.getElementById('usedRange').value,notes:document.getElementById('returnNotes').value};showPhysicalConfirm(b)})});
}
function showPhysicalConfirm(b){document.getElementById('modalTitle').textContent='Confirm physical book receipt';document.getElementById('modalBody').innerHTML=`<div class="notice"><span>✓</span><div>Return OTP verified successfully for <b>${b.id}</b>. The book is still not closed.</div></div><p style="font-size:13px;line-height:1.6">Confirm that you have physically received and checked the receipt book from <b>${b.holder}</b>.</p><div class="notice warn"><span>!</span><div>Once confirmed, this assignment will be closed and the book will become available for a new issue. Collection discrepancy, if any, will remain in the record.</div></div>`;document.getElementById('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Not yet</button><button class="btn primary" onclick="confirmPhysical('${b.id}')">Confirm physical receipt & close</button>`;document.getElementById('modalback').classList.add('show')}
function confirmPhysical(id){let b=books.find(x=>x.id===id),r=b.pendingReturn;if(!r)return;b.used=r.used;b.collection=r.collection;b.cash=r.cash;b.status='Closed';let a=[...b.assignments].reverse().find(x=>x.status==='Active');if(a){a.status='Closed';a.returnDate=r.date;a.used=r.used;a.unused=r.unused;a.collection=r.collection;a.cash=r.cash;a.notes=r.notes;a.physicalConfirmed=true}let v=volunteers.find(x=>x.name===b.holder);if(v)v.books=Math.max(0,v.books-1);events.unshift({icon:'✓',title:`Book ${b.id} returned and closed`,desc:`${b.holder} · ${r.used} used / ${r.unused} unused · Cash ${money(r.cash)}`,date:r.date});delete b.pendingReturn;b.holder='';b.phone='';closeModal();toast(`${id} closed successfully. It can now be reissued.`);nav('books')}
function renderBooks(){
content.innerHTML=head('INVENTORY','Receipt books','Track each physical book, its current custody, receipt range and full assignment history.',`<button class="btn primary" onclick="openAddBook()">＋ Add book</button>`)+
`<div class="panel"><div class="panelhead"><div><h3>All receipt books</h3><p>${books.length} books registered in this demo</p></div><div class="toolbar"><input id="bookSearch" class="search" placeholder="Search book or holder…"/><div class="filters"><select id="bookFilter"><option value="">All statuses</option><option>Available</option><option>Issued</option><option>Closed</option></select></div></div></div><div class="tablewrap"><table><thead><tr><th>Book</th><th>Receipt range</th><th>Current holder</th><th>Due date</th><th>Collection</th><th>Status</th><th>Action</th></tr></thead><tbody id="bookRows"></tbody></table></div></div>`;
function rows(){let q=document.getElementById('bookSearch').value.toLowerCase(),f=document.getElementById('bookFilter').value;let list=books.filter(b=>(!q||(b.id+b.holder).toLowerCase().includes(q))&&(!f||b.status===f));document.getElementById('bookRows').innerHTML=list.length?list.map(b=>`<tr><td><b>${b.id}</b><div class="muted" style="font-size:10px;margin-top:4px">${b.assignments.length} assignment(s)</div></td><td>${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}<div class="muted" style="font-size:10px;margin-top:4px">${b.used||0} used · ${25-(b.used||0)} unused</div></td><td>${b.holder?`<div class="person"><div class="persondot">${initials(b.holder)}</div><div><b>${b.holder}</b><small>${b.phone}</small></div></div>`:'<span class="muted">—</span>'}</td><td>${b.status==='Issued'?fmtDate(b.dueDate):'—'}${b.status==='Issued'&&b.dueDate<iso(new Date())?'<div style="margin-top:4px">'+pill('Overdue','red')+'</div>':''}</td><td class="money">${money(b.collection)}</td><td>${statusPill(b.status)}</td><td><button class="btn small" onclick="viewHistory('${b.id}')">History</button> ${b.status==='Available'?`<button class="btn small primary" onclick="issueSpecific('${b.id}')">Issue</button>`:b.status==='Issued'?`<button class="btn small" onclick="returnSpecific('${b.id}')">Return</button>`:''}</td></tr>`).join(''):`<tr><td colspan="7"><div class="empty"><div class="big">⌕</div>No books match your search.</div></td></tr>`}
document.getElementById('bookSearch').addEventListener('input',rows);document.getElementById('bookFilter').addEventListener('change',rows);rows()
}
function issueSpecific(id){nav('issue');setTimeout(()=>{let s=document.getElementById('issueBook');if(s)s.value=id},0)}
function returnSpecific(id){nav('return');setTimeout(()=>{let s=document.getElementById('returnBook');if(s){s.value=id;s.dispatchEvent(new Event('change'))}},0)}
function openAddBook(){document.getElementById('modalTitle').textContent='Add receipt book';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><div class="field"><label>Book number *</label><input id="newBookId" placeholder="B007"/></div><div class="field"><label>Number of leaves</label><input id="newBookCount" type="number" value="25" min="1" max="500"/></div><div class="field"><label>First receipt number *</label><input id="newBookStart" type="number" value="${Math.max(...books.map(b=>b.end))+1}"/></div></div><p class="muted" style="font-size:11px;margin-top:12px">This demo creates sequential receipt ranges. Production should validate ranges against all existing books.</p>`;document.getElementById('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveNewBook()">Add book</button>`;document.getElementById('modalback').classList.add('show')}
function saveNewBook(){let id=document.getElementById('newBookId').value.trim().toUpperCase(),count=Number(document.getElementById('newBookCount').value),start=Number(document.getElementById('newBookStart').value);if(!id||books.some(b=>b.id===id)||!count||count<1||count>500||!start||start<1){toast('Enter a unique book number and valid receipt range.');return}let end=start+count-1;if(books.some(b=>!(end<b.start||start>b.end))){toast('Receipt range overlaps an existing book.');return}books.push({id,start,end,status:'Available',holder:'',phone:'',issueDate:'',dueDate:'',used:0,collection:0,cash:0,assignments:[]});events.unshift({icon:'＋',title:`Book ${id} registered`,desc:`Receipts ${String(start).padStart(4,'0')}–${String(end).padStart(4,'0')}`,date:iso(new Date())});closeModal();toast(`${id} added to inventory.`);renderBooks()}
function viewHistory(id){let b=books.find(x=>x.id===id);document.getElementById('modalTitle').textContent=`Book history · ${id}`;document.getElementById('modalBody').innerHTML=`<div class="notice"><span>▤</span><div><b>Receipt range:</b> ${String(b.start).padStart(4,'0')}–${String(b.end).padStart(4,'0')}<br/><b>Current status:</b> ${b.status}</div></div>${b.assignments.length?b.assignments.slice().reverse().map(a=>`<div class="activity"><div class="activityicon">${a.status==='Closed'?'✓':'↗'}</div><div style="flex:1"><b>${a.person}</b><p>${a.phone} · Issued ${fmtDate(a.issueDate)} · Due ${fmtDate(a.dueDate)}</p>${a.returnDate?`<p>Returned ${fmtDate(a.returnDate)} · ${a.used} used / ${a.unused} unused · Collection ${money(a.collection)} · Cash ${money(a.cash)}</p>`:''}<div style="margin-top:6px">${a.status==='Closed'?pill('Closed','gray'):pill('Active assignment','green')}</div></div></div>`).join(''):'<div class="empty">No assignment history yet.</div>'}`;document.getElementById('modalFoot').innerHTML=`<button class="btn primary" onclick="closeModal()">Done</button>`;document.getElementById('modalback').classList.add('show')}
function renderVolunteers(){content.innerHTML=head('PEOPLE','Volunteers','Manage registered volunteers and review their receipt book responsibility.',`<button class="btn primary" onclick="openAddVolunteer()">＋ Add volunteer</button>`)+
`<div class="panel"><div class="panelhead"><div><h3>Volunteer register</h3><p>Volunteer access to the app is not required</p></div><input id="volSearch" class="search" placeholder="Search name or mobile…"/></div><div class="tablewrap"><table><thead><tr><th>Volunteer</th><th>Mobile number</th><th>Current books</th><th>Assignments</th><th>Status</th><th>Action</th></tr></thead><tbody id="volRows"></tbody></table></div></div>`;
function rows(){let q=document.getElementById('volSearch').value.toLowerCase();let list=volunteers.filter(v=>(v.name+v.phone).toLowerCase().includes(q));document.getElementById('volRows').innerHTML=list.map(v=>`<tr><td><div class="person"><div class="persondot">${initials(v.name)}</div><div><b>${v.name}</b><small>${v.id}</small></div></div></td><td>${v.phone}</td><td>${v.books}</td><td>${books.reduce((n,b)=>n+b.assignments.filter(a=>a.person===v.name).length,0)}</td><td>${pill(v.status,'green')}</td><td><button class="btn small" onclick="volHistory('${v.id}')">History</button></td></tr>`).join('')}
document.getElementById('volSearch').addEventListener('input',rows);rows()}
function openAddVolunteer(){document.getElementById('modalTitle').textContent='Register volunteer';document.getElementById('modalBody').innerHTML=`<div class="formgrid"><div class="field full"><label>Full name *</label><input id="newVolName" placeholder="Volunteer full name"/></div><div class="field full"><label>Mobile number *</label><input id="newVolPhone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"/><small>In production, the number should be verified before it can receive OTPs.</small></div></div>`;document.getElementById('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveVolunteer()">Save volunteer</button>`;document.getElementById('modalback').classList.add('show')}
function saveVolunteer(){let name=document.getElementById('newVolName').value.trim(),phone=document.getElementById('newVolPhone').value.trim();if(!name||!/^[6-9]\d{9}$/.test(phone)){toast('Enter a name and valid 10-digit Indian mobile number.');return}if(volunteers.some(v=>v.phone===phone)){toast('This mobile number is already registered.');return}let nextVolNum=Math.max(0,...volunteers.map(v=>Number(v.id.slice(1))))+1;let id='V'+String(nextVolNum).padStart(3,'0');volunteers.push({id,name,phone,status:'Active',books:0});closeModal();toast(`${name} registered.`);renderVolunteers()}
function volHistory(id){let v=volunteers.find(x=>x.id===id),assigned=books.filter(b=>b.assignments.some(a=>a.person===v.name));document.getElementById('modalTitle').textContent=`Assignment history · ${v.name}`;document.getElementById('modalBody').innerHTML=`<div class="notice"><span>♙</span><div><b>${v.name}</b><br/>${v.phone}<br/>${assigned.length} book assignment(s) recorded</div></div>${assigned.length?assigned.map(b=>`<div class="activity"><div class="activityicon">▤</div><div><b>${b.id}</b><p>${b.assignments.filter(a=>a.person===v.name).map(a=>`${fmtDate(a.issueDate)} · ${a.status}`).join('<br/>')}</p></div></div>`).join(''):'<div class="empty">No assignments recorded.</div>'}`;document.getElementById('modalFoot').innerHTML=`<button class="btn primary" onclick="closeModal()">Done</button>`;document.getElementById('modalback').classList.add('show')}
function renderReports(){let closed=books.filter(b=>b.status==='Closed'),issued=books.filter(b=>b.status==='Issued');content.innerHTML=head('REPORTING','Reports & history','Review custody changes, book utilization and recorded collection. Export is simulated in this demo.',`<button class="btn" onclick="exportCsv()">↓ Export CSV</button>`)+
`<div class="cards"><div class="stat"><div class="stathead">Books registered <span class="staticon">▤</span></div><div class="statvalue">${books.length}</div><div class="statfoot">All statuses</div></div><div class="stat"><div class="stathead">Total recorded collection <span class="staticon">₹</span></div><div class="statvalue">${money(books.reduce((s,b)=>s+b.collection,0))}</div><div class="statfoot">Demo dataset</div></div><div class="stat"><div class="stathead">Closed assignments <span class="staticon">✓</span></div><div class="statvalue">${closed.length}</div><div class="statfoot">Books currently closed</div></div><div class="stat"><div class="stathead">Active assignments <span class="staticon">↗</span></div><div class="statvalue">${issued.length}</div><div class="statfoot">Current book holders</div></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><div><h3>Book collection summary</h3><p>Declared collection vs cash received</p></div></div><div class="tablewrap"><table><thead><tr><th>Book</th><th>Holder / last holder</th><th>Collection</th><th>Cash received</th><th>Difference</th></tr></thead><tbody>${books.filter(b=>b.collection||b.status==='Issued').map(b=>`<tr><td><b>${b.id}</b></td><td>${b.holder||b.assignments.slice(-1)[0]?.person||'—'}</td><td class="money">${money(b.collection)}</td><td class="money">${money(b.cash)}</td><td>${b.collection-b.cash?pill(money(b.collection-b.cash),'amber'):pill('Matched','green')}</td></tr>`).join('')}</tbody></table></div></section>
<section class="panel"><div class="panelhead"><div><h3>Accountability overview</h3><p>Receipt-book inventory utilization</p></div></div><div class="panelbody">${[['Available',books.filter(b=>b.status==='Available').length,'#3c66bd'],['Issued',issued.length,'#1c7c54'],['Closed',closed.length,'#7d8796']].map(x=>`<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px"><b>${x[0]}</b><span>${x[1]} books</span></div><div class="progress"><span style="width:${books.length?x[1]/books.length*100:0}%;background:${x[2]}"></span></div></div>`).join('')}<div class="notice warn"><span>!</span><div>Receipt-wise collections are not captured in this demo. Figures are sample book-level totals entered by the treasurer.</div></div></div></section></div>
<section class="panel"><div class="panelhead"><div><h3>Audit & activity log</h3><p>Recent issue, return and inventory actions</p></div></div><div class="panelbody">${events.map(e=>`<div class="activity"><div class="activityicon">${e.icon}</div><div><b>${e.title}</b><p>${e.desc}</p><time>${fmtDate(e.date)}</time></div></div>`).join('')}</div></section>`}
function exportCsv(){let rows=[['Book ID','Receipt Start','Receipt End','Status','Current Holder','Phone','Issue Date','Due Date','Used Count','Collection','Cash Received'],...books.map(b=>[b.id,b.start,b.end,b.status,b.holder,b.phone,b.issueDate,b.dueDate,b.used,b.collection,b.cash])];let csv=rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='temple-ledger-demo-report.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV report exported.')}
function openOtp(title,desc,onSuccess){modalAction=onSuccess;pendingOtp='123456';document.getElementById('modalTitle').textContent='Verify OTP · '+title;document.getElementById('modalBody').innerHTML=`<div class="notice"><span>✉</span><div>${desc}<br/><b>Demo mode:</b> Use code 123456. No SMS is sent.</div></div><label style="font-size:11px;font-weight:800;color:#596477">ENTER 6-DIGIT OTP</label><div class="otpboxes">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" aria-label="OTP digit ${i+1}" id="otp${i}"/>`).join('')}</div><div id="otpError" style="font-size:11px;color:#b84646;min-height:16px"></div><button class="btn small" onclick="fillDemoOtp()">Fill demo OTP</button><p class="muted" style="font-size:10px;margin-bottom:0">In the production system, OTP expiry and attempt limits will be enforced by the backend.</p>`;document.getElementById('modalFoot').innerHTML=`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="verifyOtp()">Verify & continue</button>`;document.getElementById('modalback').classList.add('show');setTimeout(()=>document.getElementById('otp0')?.focus(),50);[0,1,2,3,4,5].forEach(i=>{let el=document.getElementById('otp'+i);el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value&&i<5)document.getElementById('otp'+(i+1)).focus()});el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&i>0)document.getElementById('otp'+(i-1)).focus()})})}
function fillDemoOtp(){[...'123456'].forEach((v,i)=>document.getElementById('otp'+i).value=v)}
function verifyOtp(){let val=[0,1,2,3,4,5].map(i=>document.getElementById('otp'+i)?.value||'').join('');if(val!==pendingOtp){document.getElementById('otpError').textContent='Incorrect OTP. Please try again (demo code: 123456).';return}let fn=modalAction;modalAction=null;closeModal();if(fn)fn()}
function closeModal(){document.getElementById('modalback').classList.remove('show');modalAction=null}
document.getElementById('closeModal').addEventListener('click',closeModal);
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
renderDashboard();
</script>
</body>
</html>
